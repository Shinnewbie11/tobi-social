<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>TobiSocial</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000; --panel:#121214; --panel-2:#1c1c20; --line:#2a2a30;
  --txt:#fff; --txt-dim:#a8a8b3; --txt-faint:#6c6c78;
  --red:#fe2c55; --cyan:#25f4ee; --accent:#fe2c55;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"Plus Jakarta Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.hidden{display:none !important}
::selection{background:var(--red);color:#fff}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);z-index:200}
.login-card{max-width:420px;width:100%;background:linear-gradient(180deg,#161618,#0c0c0e);border:1px solid var(--line);border-radius:24px;padding:44px 30px}
.logo{font-family:"Bricolage Grotesque";font-weight:800;font-size:34px;letter-spacing:-1px;background:linear-gradient(100deg,var(--cyan),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
#login p{color:var(--txt-dim);margin:10px 0 22px;font-size:15px}
.login-status{margin-top:16px;font-size:13px;color:var(--txt-faint);background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.spinner{width:34px;height:34px;border-radius:50%;margin:0 auto 18px;border:3px solid var(--line);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- APP SHELL ---------- */
#app{position:fixed;inset:0}

/* ---------- TOP STORIES BAR (chỉ ở feed) ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:60;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent)}
.stories{display:flex;gap:11px;overflow-x:auto;padding:2px 2px 6px}
.stories::-webkit-scrollbar{display:none}
.story-item{flex-shrink:0;width:60px;text-align:center}
.story-ring{width:54px;height:54px;border-radius:50%;padding:2.5px;margin:0 auto 4px;background:linear-gradient(135deg,var(--cyan),var(--red))}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000}
.story-add .story-ring{background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.4);display:grid;place-items:center;font-size:22px;color:var(--cyan);padding:0}
.story-name{font-size:10.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}

/* ---------- FEED (kiểu Facebook) ---------- */
#feed{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 92px) 0 calc(env(safe-area-inset-bottom) + 76px);display:flex;flex-direction:column;gap:10px}
#feed::-webkit-scrollbar{display:none}
.fbcard{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 14px 6px}
.fb-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fb-av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#333;cursor:pointer}
.fb-name{font-weight:800;font-size:15px;cursor:pointer}
.fb-time{font-size:12px;color:var(--txt-faint)}
.fb-del{margin-left:auto;font-size:20px;color:var(--txt-dim);padding:4px 8px}
.fb-text{font-size:15.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.fb-media{width:100%;max-height:75vh;object-fit:cover;border-radius:12px;background:#000;margin-bottom:8px}
.fb-media.contain{object-fit:contain}
.fb-actions{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:4px}
.fb-act{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border-radius:9px;font-size:14px;font-weight:700;color:var(--txt-dim)}
.fb-act:hover{background:var(--panel-2)}
.fb-act.liked{color:var(--red)}

/* ---------- VIEW: CHAT / PROFILE (cuộn thường) ---------- */
.page{position:absolute;inset:0;bottom:0;overflow-y:auto;background:var(--bg);padding-bottom:84px}
.page::-webkit-scrollbar{width:0}
.page-head{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font-weight:800;font-size:17px}
.page-head .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

/* CHAT */
#chatView{display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(env(safe-area-inset-bottom) + 60px)}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px}
.chat-body::-webkit-scrollbar{width:0}
.msg{display:flex;gap:9px;max-width:86%}
.msg img.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;align-self:flex-end;object-fit:cover}
.msg .content{display:flex;flex-direction:column;gap:2px}
.msg .who{font-size:11px;color:var(--txt-faint);padding-left:4px}
.msg .bubble{background:var(--panel-2);border:1px solid var(--line);padding:9px 13px;border-radius:15px;font-size:14.5px;word-break:break-word}
.msg .bubble img,.msg .bubble video{max-width:200px;max-height:240px;border-radius:10px;margin-top:2px}
.msg.mine{margin-left:auto;flex-direction:row-reverse}
.msg.mine .who{text-align:right;padding-right:4px;padding-left:0}
.msg.mine .bubble{background:linear-gradient(120deg,var(--red),#ff5b7d);border-color:transparent;color:#fff;border-bottom-right-radius:5px}
.chat-foot{display:flex;gap:8px;padding:10px 12px;background:rgba(0,0,0,.9);border-top:1px solid var(--line);flex-shrink:0}
.chat-foot input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:12px 15px;font-size:16px;outline:none}
.chat-foot input:focus{border-color:var(--red)}
.chat-foot .ic{width:44px;border-radius:13px;font-size:18px;background:var(--panel-2);border:1px solid var(--line)}
.chat-foot .send{width:46px;border-radius:13px;font-size:18px;background:linear-gradient(120deg,var(--red),#ff5b7d);color:#fff;font-weight:800}

/* PROFILE */
.pcover{height:150px;background:linear-gradient(120deg,var(--red),#7a2bff,var(--cyan));background-size:cover;background-position:center;position:relative}
.pcover-btn{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 12px;border-radius:10px;font-size:12.5px;font-weight:700}
.phead{padding:0 18px;margin-top:-46px;display:flex;align-items:flex-end;gap:14px}
.pav-wrap{position:relative}
.pav{width:94px;height:94px;border-radius:50%;border:4px solid #000;object-fit:cover;background:#222}
.pav-cam{position:absolute;right:0;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-size:14px;display:grid;place-items:center;border:3px solid #000}
.pinfo{flex:1;padding-bottom:6px}
.pname{font-family:"Bricolage Grotesque";font-size:21px;font-weight:800}
.pstats{font-size:13px;color:var(--txt-dim);margin-top:2px}
.pbio{padding:14px 18px;font-size:14px;color:var(--txt-dim);white-space:pre-wrap}
.pbio .ph{color:var(--txt-faint);font-style:italic}
.btn-edit{margin:0 18px;background:var(--panel-2);border:1px solid var(--line);color:#fff;padding:9px 0;border-radius:11px;font-size:13.5px;font-weight:700;width:calc(100% - 36px)}
.bioedit{padding:10px 18px;display:flex;flex-direction:column;gap:9px}
.bioedit textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;color:#fff;padding:11px;font-size:16px;resize:vertical;min-height:70px;outline:none}
.bioedit .row{display:flex;gap:8px}
.bioedit .row button{flex:1;padding:10px;border-radius:11px;font-weight:700}
.bioedit .save{background:linear-gradient(120deg,var(--red),#ff5b7d);color:#fff}
.bioedit .cancel{background:var(--panel-2);border:1px solid var(--line);color:var(--txt-dim)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:14px 2px 0}
.g-item{position:relative;aspect-ratio:9/13;background:var(--panel-2);overflow:hidden;cursor:pointer}
.g-item img,.g-item video{width:100%;height:100%;object-fit:cover}
.g-item .g-text{width:100%;height:100%;display:grid;place-items:center;padding:8px;font-size:12px;color:var(--txt-dim);text-align:center;background:radial-gradient(120% 90% at 50% 0%,#241a2e,#0a0a0c)}
.g-item .g-badge{position:absolute;top:5px;right:6px;font-size:13px;text-shadow:0 1px 3px #000}

/* ---------- BOTTOM NAV ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);background:rgba(0,0,0,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--txt-faint);padding:4px}
.nav-btn .ni{font-size:21px;line-height:1}
.nav-btn.active{color:#fff}
.nav-add .ni{font-size:13px;font-weight:900;background:linear-gradient(120deg,var(--cyan),var(--red));color:#000;width:42px;height:28px;border-radius:9px;display:grid;place-items:center}

/* ---------- SHEETS (composer + comments) ---------- */
.sheet-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:.28s cubic-bezier(.2,.8,.2,1);max-height:88dvh;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.sheet-grip{width:40px;height:4px;border-radius:3px;background:var(--line);margin:10px auto 4px}
.sheet-head{display:flex;align-items:center;padding:6px 16px 12px;font-weight:800;font-size:16px;border-bottom:1px solid var(--line)}
.sheet-head .x{margin-left:auto;font-size:22px;color:var(--txt-dim)}
.sheet-body{overflow-y:auto;padding:14px 16px}

/* composer */
.comp-top{display:flex;gap:11px}
.comp-top img{width:42px;height:42px;border-radius:50%;flex-shrink:0;object-fit:cover}
.comp textarea{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;color:#fff;padding:11px 13px;font-size:16px;resize:none;min-height:90px;outline:none}
.comp textarea:focus{border-color:var(--red)}
.comp-prev{margin-top:12px;border-radius:13px;overflow:hidden;border:1px solid var(--line);position:relative}
.comp-prev .rm{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:30px;text-align:center}
.comp-act{display:flex;align-items:center;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--txt-dim);padding:9px 13px;border-radius:11px;font-size:13.5px;font-weight:700}
.chip:hover{color:var(--cyan);border-color:var(--cyan)}
.btn-post{margin-left:auto;background:linear-gradient(120deg,var(--red),#ff5b7d);color:#fff;font-weight:800;padding:10px 22px;border-radius:11px;font-size:14.5px}
.btn-post:disabled{opacity:.5}

/* comments */
.cmt{display:flex;gap:9px;margin-bottom:13px}
.cmt img{width:34px;height:34px;border-radius:50%;flex-shrink:0;object-fit:cover}
.cmt .cn{font-weight:700;font-size:13px;color:var(--cyan)}
.cmt .ct{font-size:14px;color:#eaeaf0}
.cmt-foot{display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line)}
.cmt-foot input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;color:#fff;padding:11px 14px;font-size:16px;outline:none}
.cmt-foot .send{width:46px;border-radius:13px;background:linear-gradient(120deg,var(--red),#ff5b7d);color:#fff;font-weight:800;font-size:18px}

/* ---------- STORY VIEWER ---------- */
#sv{position:fixed;inset:0;z-index:110;background:#000;display:none}
#sv.open{display:block}
.sv-media{width:100%;height:100%;display:grid;place-items:center;background:#000}
.sv-media img,.sv-media video{width:100%;height:100%;object-fit:contain}
.sv-bars{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;gap:4px;z-index:3}
.sv-bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.sv-bar .fill{height:100%;width:0;background:#fff}
.sv-bar.done .fill{width:100%}
.sv-bar.active .fill{animation:fill var(--dur,5s) linear forwards}
@keyframes fill{to{width:100%}}
.sv-top{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:3}
.sv-top img{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);object-fit:cover}
.sv-top .nm{font-weight:700;font-size:14px;text-shadow:0 1px 5px #000}
.sv-top .tm{font-size:11px;color:rgba(255,255,255,.75)}
.sv-x{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:14px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:18px}
.sv-nav{position:absolute;inset:0;display:flex;z-index:2}.sv-nav div{flex:1}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%) translateY(20px);z-index:130;background:var(--panel-2);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:13px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:50px 20px;text-align:center;color:var(--txt-faint);font-size:14px}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="login-card">
    <div class="logo">TobiSocial</div>
    <p>Mạng xã hội kết nối Discord</p>
    <div class="spinner" id="loginSpinner"></div>
    <div class="login-status" id="loginStatus">Đang kiểm tra đăng nhập…</div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">

  <!-- Top stories (feed) -->
  <div id="topbar"><div id="dbg" style="font-size:11px;color:#25f4ee;padding:0 4px 4px;font-weight:700">bài: …</div><div class="stories" id="storiesBar"></div></div>

  <!-- FEED -->
  <div id="feed"></div>

  <!-- CHAT -->
  <div id="chatView" class="page hidden">
    <div class="page-head"><span class="dot"></span> Chat chung</div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-foot">
      <button class="ic" id="chatImg" title="Gửi ảnh">🖼️</button>
      <button class="ic" id="chatVid" title="Gửi video">🎬</button>
      <input id="chatInput" placeholder="Nhắn gì đó…" autocomplete="off">
      <button class="send" id="chatSend">➤</button>
    </div>
  </div>

  <!-- PROFILE -->
  <div id="profileView" class="page hidden">
    <div class="pcover" id="pCover"><button class="pcover-btn hidden" id="pCoverBtn" onclick="pickMedia('image','cover')">📷 Đổi ảnh bìa</button></div>
    <div class="phead">
      <div class="pav-wrap">
        <img class="pav" id="pAvatar" alt="">
        <button class="pav-cam hidden" id="pAvatarBtn" onclick="pickMedia('image','avatar')">📷</button>
      </div>
      <div class="pinfo"><div class="pname" id="pName"></div><div class="pstats" id="pStats"></div></div>
    </div>
    <button class="btn-edit hidden" id="pEditBtn" onclick="toggleBioEdit()" style="margin-top:12px">✏️ Sửa hồ sơ</button>
    <div class="pbio" id="pBio"></div>
    <div class="bioedit hidden" id="pBioEdit">
      <input id="nameInput" placeholder="Tên hiển thị" maxlength="30" style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;color:#fff;padding:11px;font-size:16px;outline:none">
      <textarea id="bioInput" placeholder="Viết giới thiệu…" maxlength="300"></textarea>
      <div class="row"><button class="save" onclick="saveProfile()">Lưu</button><button class="cancel" onclick="toggleBioEdit()">Huỷ</button></div>
    </div>
    <div class="pgrid" id="pGrid"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div id="nav">
    <button class="nav-btn" id="nbHome" onclick="location.hash='#/'"><span class="ni">🏠</span>Feed</button>
    <button class="nav-btn nav-add" onclick="openComposer()"><span class="ni">＋</span></button>
    <button class="nav-btn" id="nbChat" onclick="location.hash='#/chat'"><span class="ni">💬</span>Chat</button>
    <button class="nav-btn" id="nbMe" onclick="goProfile(me.id)"><span class="ni">👤</span>Tôi</button>
  </div>
</div>

<!-- COMPOSER SHEET -->
<div class="sheet-bg" id="compBg" onclick="closeComposer()"></div>
<div class="sheet" id="compSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head">Tạo bài viết<button class="x" onclick="closeComposer()">✕</button></div>
  <div class="sheet-body comp">
    <div class="comp-top">
      <img id="compAvatar" alt="">
      <textarea id="postText" placeholder="Bạn đang nghĩ gì thế?"></textarea>
    </div>
    <div id="postPreview"></div>
    <div class="comp-act">
      <button class="chip" onclick="pickMedia('image','post')">🖼️ Ảnh</button>
      <button class="chip" onclick="pickMedia('video','post')">🎬 Video</button>
      <button class="btn-post" id="btnPost" onclick="submitPost()">Đăng</button>
    </div>
  </div>
</div>

<!-- COMMENTS SHEET -->
<div class="sheet-bg" id="cmtBg" onclick="closeComments()"></div>
<div class="sheet" id="cmtSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head" id="cmtTitle">Bình luận<button class="x" onclick="closeComments()">✕</button></div>
  <div class="sheet-body" id="cmtList" style="flex:1"></div>
  <div class="cmt-foot">
    <input id="cmtInput" placeholder="Viết bình luận…" autocomplete="off">
    <button class="send" id="cmtSend">➤</button>
  </div>
</div>

<!-- STORY VIEWER -->
<div id="sv">
  <button class="sv-x" onclick="closeStory()">✕</button>
  <div class="sv-bars" id="svBars"></div>
  <div class="sv-top" id="svTop"></div>
  <div class="sv-media" id="svMedia"></div>
  <div class="sv-nav"><div onclick="prevStory()"></div><div onclick="nextStory()"></div></div>
</div>

<input type="file" id="mediaPicker" style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;">
<div id="toast"></div>

let currentView='home', currentProfileId=null, userCache={}, commentCounts={};

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo=(t)=>{const s=Math.floor((Date.now()-t)/1000);if(s<60)return"vừa xong";if(s<3600)return Math.floor(s/60)+" phút";if(s<86400)return Math.floor(s/3600)+" giờ";return new Date(t).toLocaleDateString('vi-VN');};
const avatarOf=(id,fb)=>(userCache[id]&&userCache[id].avatar)||fb||'';
const nameOf=(id,fb)=>(userCache[id]&&userCache[id].name)||fb||'Người dùng';
const vthumb=(u)=>{
  if(!u)return '';
  if(/\.(mp4|mov|webm|avi|mkv|m4v)$/i.test(u)) return u.replace(/\.(mp4|mov|webm|avi|mkv|m4v)$/i,'.jpg');
  if(u.includes('/video/upload/')) return u+'.jpg';
  return u;
};
let _tt=null;
function toast(msg,ms=2200){const t=$('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),ms);}

/* ========== ĐĂNG NHẬP ========== */
async function boot(){
  const token=new URLSearchParams(location.search).get('token');
  if(token){
    $('loginStatus').textContent="Đang xác thực token…";
    try{
      const snap=await db.ref('loginTokens/'+token).get();
      if(snap.exists()){
        const d=snap.val();
        if(d.createdAt && Date.now()-d.createdAt>10*60*1000) return fail("Link đã hết hạn. Gõ lại lệnh trong Discord nhé.");
        me={id:d.discordId,name:d.username,avatar:d.avatar,discordAvatar:d.avatar,discordName:d.username};
        localStorage.setItem('tobi_me',JSON.stringify(me));
        history.replaceState({},"",location.pathname);
        return enterApp();
      }
      return fail("Token không hợp lệ hoặc đã dùng. Lấy link mới trong Discord nhé.");
    }catch(e){console.error(e);return fail("Lỗi kết nối Firebase.");}
  }
  const saved=localStorage.getItem('tobi_me');
  if(saved){me=JSON.parse(saved);return enterApp();}
  fail("Bạn chưa đăng nhập. Vào Discord gõ <b>tweb</b> để lấy link đăng nhập.");
}
function fail(m){$('loginSpinner').classList.add('hidden');$('loginStatus').innerHTML=m;}
function logout(){localStorage.removeItem('tobi_me');location.href=location.pathname;}

async function enterApp(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  if(!me.discordAvatar)me.discordAvatar=me.avatar;
  if(!me.discordName)me.discordName=me.name;
  let prof={};
  try{const s=await db.ref('users/'+me.id).get();if(s.exists())prof=s.val();}catch{}
  me.avatar=prof.avatar||me.discordAvatar;
  me.name=prof.name||me.discordName;   // tên tuỳ chỉnh thắng
  const upd={lastSeen:Date.now()};
  if(!prof.avatar)upd.avatar=me.avatar;
  if(!prof.name) upd.name=me.name;     // chỉ set tên lần đầu
  db.ref('users/'+me.id).update(upd);
  localStorage.setItem('tobi_me',JSON.stringify(me));
  $('compAvatar').src=me.avatar;
  ensureObserver();
  listenUsers(); listenCommentCounts(); listenFeed(); listenStories(); listenChat(); bindChat(); bindComments();
  window.addEventListener('hashchange',renderRoute);
  renderRoute();
}

/* ========== ĐIỀU HƯỚNG ========== */
function goProfile(id){location.hash='#/u/'+id;}
function renderRoute(){
  const h=location.hash;
  $('feed').classList.add('hidden'); $('chatView').classList.add('hidden'); $('profileView').classList.add('hidden'); $('topbar').classList.add('hidden');
  $('nbHome').classList.remove('active'); $('nbChat').classList.remove('active'); $('nbMe').classList.remove('active');
  if(h.startsWith('#/chat')){
    currentView='chat'; $('chatView').classList.remove('hidden'); $('nbChat').classList.add('active');
  }else if(h.startsWith('#/u/')){
    currentView='profile'; currentProfileId=h.slice(4);
    $('profileView').classList.remove('hidden');
    if(currentProfileId===me.id)$('nbMe').classList.add('active');
    renderProfile(currentProfileId);
  }else{
    currentView='home'; $('feed').classList.remove('hidden'); $('topbar').classList.remove('hidden'); $('nbHome').classList.add('active');
  }
}

/* ========== ẢNH/VIDEO ========== */
function pickMedia(type,target){
  const input=$('mediaPicker');
  input.accept=type==='video'?'video/*':'image/*';
  input.value='';
  input.onchange=async()=>{
    const file=input.files&&input.files[0]; if(!file)return;
    const maxDim=target==='avatar'?256:target==='cover'?1200:1080;
    toast('⏳ Đang xử lý…',60000);
    const res=await processMedia(file,type,maxDim);
    if(!res)return;
    toast('✅ Xong!');
    if(target==='post'){pendingMedia={url:res,type};renderPreview();}
    if(target==='story'){await createStory(res,type);toast('✅ Đã đăng tin!');}
    if(target==='avatar'){await saveAvatar(res);toast('✅ Đã đổi ảnh đại diện!');}
    if(target==='cover'){await saveCover(res);toast('✅ Đã đổi ảnh bìa!');}
    if(target==='chat'){sendChatMedia(res,type);}
  };
  input.click();
}
function processMedia(file,type,maxDim){
  return new Promise((resolve)=>{
    if(type==='image'){
      // GIF: giữ nguyên để chạy hoạt ảnh (không nén qua canvas vì sẽ mất động)
      if(file.type==='image/gif'){
        if(file.size>2.5*1024*1024){toast('⚠️ GIF quá lớn (>2.5MB). Chọn GIF nhẹ hơn nhé.',4500);resolve(null);return;}
        const rg=new FileReader();
        rg.onload=()=>resolve(rg.result);
        rg.onerror=()=>{toast('❌ Lỗi đọc GIF.',3500);resolve(null);};
        rg.readAsDataURL(file);
        return;
      }
      const r=new FileReader();
      r.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          let w=img.width,h=img.height;
          if(w>=h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
          else if(h>w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
          const cv=document.createElement('canvas');cv.width=w;cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          resolve(cv.toDataURL('image/jpeg',0.72));
        };
        img.onerror=()=>{toast('❌ Không đọc được ảnh.',3500);resolve(null);};
        img.src=r.result;
      };
      r.onerror=()=>{toast('❌ Lỗi đọc ảnh.',3500);resolve(null);};
      r.readAsDataURL(file);
    }else{
      if(CLOUDINARY_CLOUD.startsWith('ĐIỀN')||CLOUDINARY_PRESET.startsWith('ĐIỀN')){
        toast('⚠️ Chưa cấu hình Cloudinary cho video. Điền 2 dòng CLOUDINARY ở đầu file nhé.',5500);resolve(null);return;
      }
      if(file.size>VIDEO_MAX_BYTES){toast('⚠️ Video quá lớn (>80MB).',4500);resolve(null);return;}
      const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_PRESET);
      fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`,{method:'POST',body:fd})
        .then(r=>r.json()).then(d=>{if(d.secure_url)resolve(d.secure_url);else throw new Error(d.error?.message||'fail');})
        .catch(e=>{console.error(e);toast('❌ Up video lỗi. Kiểm tra preset (Unsigned).',4500);resolve(null);});
    }
  });
}

/* ========== COMPOSER ========== */
function openComposer(){$('compBg').classList.add('open');$('compSheet').classList.add('open');$('compAvatar').src=me.avatar;}
function closeComposer(){$('compBg').classList.remove('open');$('compSheet').classList.remove('open');}
function renderPreview(){
  const box=$('postPreview');
  if(!pendingMedia){box.innerHTML="";return;}
  const m=pendingMedia.type==='video'?`<video src="${pendingMedia.url}" controls></video>`:`<img src="${pendingMedia.url}">`;
  box.innerHTML=`<div class="comp-prev">${m}<div class="rm" onclick="clearMedia()">✕</div></div>`;
}
function clearMedia(){pendingMedia=null;renderPreview();}
async function submitPost(){
  const text=$('postText').value.trim();
  if(!text&&!pendingMedia){toast('Nhập nội dung hoặc chọn ảnh/video nhé.');return;}
  $('btnPost').disabled=true;
  await db.ref('posts').push({authorId:me.id,authorName:me.name,authorAvatar:me.avatar,text,mediaUrl:pendingMedia?.url||null,mediaType:pendingMedia?.type||null,createdAt:Date.now(),likes:{}});
  $('postText').value="";clearMedia();$('btnPost').disabled=false;closeComposer();
  location.hash='#/';
  setTimeout(()=>{const f=$('feed');if(f)f.scrollTop=0;},150); // lên đầu để thấy bài vừa đăng
  toast('✅ Đã đăng!');
}

/* ========== FEED (TikTok) ========== */
function listenFeed(){
  db.ref('posts').limitToLast(80).on('value',snap=>{
    allPosts=[];snap.forEach(c=>allPosts.push({id:c.key,...c.val()}));allPosts.reverse();
    renderFeed();
    if(currentView==='profile')renderProfile(currentProfileId);
  });
}
let feedObserver=null;
function ensureObserver(){}
function renderFeed(){
  const wrap=$('feed');
  const dbg=$('dbg');
  if(!allPosts.length){wrap.innerHTML='<div class="empty" style="padding:60px 20px;text-align:center">Chưa có bài viết. Bấm ＋ để đăng bài đầu tiên!</div>';if(dbg)dbg.textContent='bài: 0';return;}
  const top=wrap.scrollTop;
  wrap.innerHTML='';
  let ok=0;
  allPosts.forEach(p=>{
    try{ wrap.appendChild(buildCard(p)); ok++; }
    catch(e){ console.error('❌ Lỗi dựng bài',p.id,'mediaType=',p.mediaType,e); }
  });
  // BẢNG CHẨN ĐOÁN (tạm) — hiện thẳng trên màn hình
  const diag=document.createElement('div');
  diag.style.cssText='background:#1c1c20;color:#25f4ee;font-size:12.5px;padding:12px 14px;line-height:1.7;border-bottom:2px solid #fe2c55';
  diag.innerHTML='🔎 Firebase trả về <b>'+allPosts.length+'</b> bài · dựng được <b>'+ok+'</b> thẻ<br>'+
    allPosts.map((p,i)=>`${i+1}. loại: <b>${p.mediaType||(p.mediaUrl?'ảnh':'chữ')}</b> — của: <b>${esc(nameOf(p.authorId,p.authorName))}</b>`).join('<br>');
  wrap.prepend(diag);
  wrap.scrollTop=top; // giữ vị trí cuộn
  if(dbg)dbg.textContent='bài: '+allPosts.length+' · thẻ: '+ok;
}
function buildCard(p){
  const card=document.createElement('div');
  card.className='fbcard';card.id='tik-'+p.id;card.dataset.pid=p.id;
  let media='';
  if(p.mediaUrl&&p.mediaType==='video') media=`<video class="fb-media contain" src="${esc(p.mediaUrl)}" poster="${esc(vthumb(p.mediaUrl))}" preload="metadata" controls playsinline webkit-playsinline></video>`;
  else if(p.mediaUrl) media=`<img class="fb-media" src="${esc(p.mediaUrl)}">`;
  const own=p.authorId===me.id;
  card.innerHTML=`
    <div class="fb-head">
      <img class="fb-av" data-av src="${esc(avatarOf(p.authorId,p.authorAvatar))}">
      <div>
        <div class="fb-name" data-name>${esc(nameOf(p.authorId,p.authorName))}</div>
        <div class="fb-time">${timeAgo(p.createdAt)}</div>
      </div>
      ${own?'<button class="fb-del" data-del>🗑️</button>':''}
    </div>
    ${p.text?`<div class="fb-text">${esc(p.text)}</div>`:''}
    ${media}
    <div class="fb-actions">
      <button class="fb-act like" data-like><span class="ico">🤍</span><span>Thích</span><span class="cnt"></span></button>
      <button class="fb-act cmt" data-cmt><span>💬</span><span>Bình luận</span><span class="cnt"></span></button>
    </div>`;
  card.querySelector('[data-av]').onclick=()=>goProfile(p.authorId);
  card.querySelector('[data-name]').onclick=()=>goProfile(p.authorId);
  card.querySelector('[data-like]').onclick=()=>toggleLike(p.id);
  card.querySelector('[data-cmt]').onclick=()=>openComments(p.id);
  if(own)card.querySelector('[data-del]').onclick=()=>deletePost(p.id);
  updateCard(card,p);
  return card;
}
function updateCard(card,p){
  const liked=p.likes&&p.likes[me.id];
  const likeCnt=p.likes?Object.keys(p.likes).length:0;
  const likeBtn=card.querySelector('[data-like]');
  likeBtn.classList.toggle('liked',!!liked);
  likeBtn.querySelector('.ico').textContent=liked?'❤️':'🤍';
  likeBtn.querySelector('.cnt').textContent=likeCnt||'';
  card.querySelector('[data-cmt] .cnt').textContent=commentCounts[p.id]||'';
  card.querySelector('[data-name]').textContent=nameOf(p.authorId,p.authorName);
}
function toggleLike(id){const r=db.ref(`posts/${id}/likes/${me.id}`);r.get().then(s=>s.exists()?r.remove():r.set(true));}
function deletePost(id){if(!confirm("Xoá bài viết này?"))return;db.ref('posts/'+id).remove();db.ref('comments/'+id).remove();}

/* ========== COMMENTS ========== */
let curCmtPost=null, cmtRef=null;
function bindComments(){
  $('cmtSend').addEventListener('click',sendComment);
  $('cmtInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendComment();}});
}
function openComments(postId){
  curCmtPost=postId;
  $('cmtBg').classList.add('open');$('cmtSheet').classList.add('open');
  $('cmtList').innerHTML='<div class="empty">Đang tải…</div>';
  if(cmtRef)cmtRef.off();
  cmtRef=db.ref('comments/'+postId).limitToLast(100);
  cmtRef.on('value',snap=>{
    const arr=[];snap.forEach(c=>arr.push(c.val()));
    $('cmtTitle').firstChild.textContent=`Bình luận (${arr.length}) `;
    $('cmtList').innerHTML=arr.length?arr.map(c=>`
      <div class="cmt"><img src="${esc(avatarOf(c.authorId,c.authorAvatar))}" onclick="goProfile('${c.authorId}')">
      <div><div class="cn">${esc(nameOf(c.authorId,c.authorName))}</div><div class="ct">${esc(c.text)}</div></div></div>`).join(''):'<div class="empty">Chưa có bình luận. Mở màn đi!</div>';
  });
}
function closeComments(){$('cmtBg').classList.remove('open');$('cmtSheet').classList.remove('open');if(cmtRef){cmtRef.off();cmtRef=null;}curCmtPost=null;}
function sendComment(){
  const inp=$('cmtInput');const text=inp.value.trim();if(!text||!curCmtPost)return;
  inp.value="";inp.focus();
  db.ref('comments/'+curCmtPost).push({authorId:me.id,authorName:me.name,authorAvatar:me.avatar,text,createdAt:Date.now()})
    .catch(e=>{console.error(e);toast('❌ Lỗi: '+(e.message||e.code),4000);});
}
function listenCommentCounts(){
  db.ref('comments').on('value',snap=>{
    commentCounts={};snap.forEach(c=>{commentCounts[c.key]=c.numChildren();});
    document.querySelectorAll('.tik').forEach(card=>{const el=card.querySelector('[data-cmt] .cnt');if(el)el.textContent=commentCounts[card.dataset.pid]||'';});
  });
}

/* ========== STORY ========== */
async function createStory(url,type){await db.ref('stories').push({authorId:me.id,authorName:me.name,authorAvatar:me.avatar,mediaUrl:url,mediaType:type,createdAt:Date.now()});}
function listenStories(){
  db.ref('stories').limitToLast(80).on('value',snap=>{
    const now=Date.now();allStories=[];
    snap.forEach(c=>{const v=c.val();if(now-v.createdAt>STORY_TTL)db.ref('stories/'+c.key).remove().catch(()=>{});else allStories.push({id:c.key,...v});});
    renderStories();
  });
}
function renderStories(){
  const bar=$('storiesBar');
  const byUser={};for(const s of allStories)(byUser[s.authorId]=byUser[s.authorId]||[]).push(s);
  let html=`<div class="story-item story-add" onclick="pickMedia('image','story')"><div class="story-ring">＋</div><div class="story-name">Tạo tin</div></div>`;
  const ids=Object.keys(byUser).sort((a,b)=>a===me.id?-1:b===me.id?1:0);
  for(const uid of ids){const u=byUser[uid][byUser[uid].length-1];
    html+=`<div class="story-item" onclick="openStory('${uid}')"><div class="story-ring"><img src="${esc(avatarOf(uid,u.authorAvatar))}"></div><div class="story-name">${uid===me.id?'Tin của bạn':esc(nameOf(uid,u.authorName))}</div></div>`;}
  bar.innerHTML=html;
}
let svList=[],svIdx=0,svTimer=null;
function openStory(uid){svList=allStories.filter(s=>s.authorId===uid).sort((a,b)=>a.createdAt-b.createdAt);if(!svList.length)return;svIdx=0;$('sv').classList.add('open');showStory();}
function showStory(){
  clearTimeout(svTimer);const s=svList[svIdx];
  $('svTop').innerHTML=`<img src="${esc(s.authorAvatar)}"><div><div class="nm">${esc(s.authorName)}</div><div class="tm">${timeAgo(s.createdAt)}</div></div>`;
  const dur=s.mediaType==='video'?0:5000;
  $('svBars').innerHTML=svList.map((_,i)=>`<div class="sv-bar ${i<svIdx?'done':''} ${i===svIdx?'active':''}" style="--dur:${dur}ms"><div class="fill"></div></div>`).join('');
  if(s.mediaType==='video'){$('svMedia').innerHTML=`<video src="${esc(s.mediaUrl)}" autoplay playsinline></video>`;$('svMedia').querySelector('video').onended=nextStory;}
  else{$('svMedia').innerHTML=`<img src="${esc(s.mediaUrl)}">`;svTimer=setTimeout(nextStory,dur);}
}
function nextStory(){if(svIdx<svList.length-1){svIdx++;showStory();}else closeStory();}
function prevStory(){if(svIdx>0){svIdx--;showStory();}}
function closeStory(){clearTimeout(svTimer);$('svMedia').innerHTML="";$('sv').classList.remove('open');}

/* ========== PROFILE ========== */
let bioEditing=false;
async function renderProfile(uid){
  let u={name:'Người dùng',avatar:'',cover:'',bio:''};
  try{const s=await db.ref('users/'+uid).get();if(s.exists())u={...u,...s.val()};}catch{}
  if(uid===me.id){u.name=me.name;u.avatar=me.avatar;}
  const mine=allPosts.filter(p=>p.authorId===uid);
  const likes=mine.reduce((n,p)=>n+(p.likes?Object.keys(p.likes).length:0),0);
  $('pAvatar').src=u.avatar||'';$('pName').textContent=u.name;
  $('pStats').textContent=`📝 ${mine.length} bài · ❤️ ${likes} thích`;
  $('pCover').style.backgroundImage=u.cover?`url("${u.cover}")`:'';
  $('pBio').innerHTML=u.bio?esc(u.bio):`<span class="ph">${uid===me.id?'Chưa có giới thiệu — bấm "Sửa hồ sơ".':'Chưa có giới thiệu.'}</span>`;
  const mineP=uid===me.id;
  $('pEditBtn').classList.toggle('hidden',!mineP);
  $('pAvatarBtn').classList.toggle('hidden',!mineP);
  $('pCoverBtn').classList.toggle('hidden',!mineP);
  if(mineP){$('bioInput').value=u.bio||"";$('nameInput').value=u.name||"";}else{$('pBioEdit').classList.add('hidden');$('pBio').classList.remove('hidden');bioEditing=false;}
  $('pGrid').innerHTML=mine.length?mine.map(p=>{
    const t=p.mediaUrl&&p.mediaType!=='video'?`<img src="${esc(p.mediaUrl)}">`:p.mediaType==='video'?`<img src="${esc(vthumb(p.mediaUrl))}"><div class="g-badge">▶️</div>`:`<div class="g-text">${esc((p.text||'').slice(0,80))}</div>`;
    return `<div class="g-item" onclick="jumpToPost('${p.id}')">${t}</div>`;
  }).join(''):'<div class="empty" style="grid-column:1/-1">Chưa có bài viết nào.</div>';
}
function jumpToPost(id){location.hash='#/';setTimeout(()=>{const c=document.getElementById('tik-'+id);if(c)c.scrollIntoView({behavior:'smooth',block:'center'});},80);}
function toggleBioEdit(){bioEditing=!bioEditing;$('pBioEdit').classList.toggle('hidden',!bioEditing);$('pBio').classList.toggle('hidden',bioEditing);}
async function saveProfile(){
  const name=$('nameInput').value.trim().slice(0,30);
  const bio=$('bioInput').value.trim().slice(0,300);
  if(!name){toast('⚠️ Tên không được để trống.');return;}
  me.name=name;
  localStorage.setItem('tobi_me',JSON.stringify(me));
  await db.ref('users/'+me.id).update({name,bio});
  bioEditing=false;$('pBioEdit').classList.add('hidden');$('pBio').classList.remove('hidden');
  renderProfile(me.id);
  toast('✅ Đã lưu hồ sơ!');
}
async function saveAvatar(url){me.avatar=url;localStorage.setItem('tobi_me',JSON.stringify(me));await db.ref('users/'+me.id).update({avatar:url});$('compAvatar').src=url;}
async function saveCover(url){await db.ref('users/'+me.id).update({cover:url});if(currentProfileId===me.id)renderProfile(me.id);}

/* ========== CHAT ========== */
function sendChat(){
  const inp=$('chatInput');const text=inp.value.trim();if(!text)return;
  inp.value="";inp.focus();
  db.ref('chat').push({authorId:me.id,authorName:me.name,authorAvatar:me.avatar,text,createdAt:Date.now()}).catch(e=>{console.error(e);toast('❌ Lỗi: '+(e.message||e.code),4000);});
}
function sendChatMedia(url,type){db.ref('chat').push({authorId:me.id,authorName:me.name,authorAvatar:me.avatar,text:'',mediaUrl:url,mediaType:type,createdAt:Date.now()}).catch(e=>{console.error(e);toast('❌ Lỗi gửi',4000);});}
function bindChat(){
  $('chatSend').addEventListener('click',sendChat);
  $('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendChat();}});
  $('chatImg').addEventListener('click',()=>pickMedia('image','chat'));
  $('chatVid').addEventListener('click',()=>pickMedia('video','chat'));
}
function listenChat(){
  const body=$('chatBody');if(body)body.innerHTML="";
  const ref=db.ref('chat').limitToLast(60);
  ref.on('child_added',s=>appendChatMsg(s.key,s.val()));
  ref.on('child_removed',s=>{const el=document.getElementById('m-'+s.key);if(el)el.remove();});
}
function appendChatMsg(key,m){
  const body=$('chatBody');if(!body||!m)return;if(document.getElementById('m-'+key))return;
  const mine=m.authorId===me.id;
  const div=document.createElement('div');div.id='m-'+key;div.className='msg'+(mine?' mine':'');
  let inner='';
  if(m.mediaUrl)inner+=m.mediaType==='video'?`<video src="${esc(m.mediaUrl)}" controls></video>`:`<img class="cimg" src="${esc(m.mediaUrl)}">`;
  if(m.text)inner+=esc(m.text);
  div.innerHTML=`<img class="av" src="${esc(avatarOf(m.authorId,m.authorAvatar))}"><div class="content"><div class="who">${mine?'Bạn':esc(nameOf(m.authorId,m.authorName))}</div><div class="bubble">${inner}</div></div>`;
  const av=div.querySelector('img.av');if(av)av.onclick=()=>goProfile(m.authorId);
  const ci=div.querySelector('.cimg');if(ci)ci.onclick=()=>window.open(m.mediaUrl,'_blank');
  body.appendChild(div);body.scrollTop=body.scrollHeight;
}

/* ========== USERS CACHE ========== */
function listenUsers(){
  db.ref('users').on('value',snap=>{
    userCache={};snap.forEach(c=>{const v=c.val();userCache[c.key]={name:v.name,avatar:v.avatar};});
    if(me&&userCache[me.id]){me.avatar=userCache[me.id].avatar||me.avatar;$('compAvatar').src=me.avatar;}
    document.querySelectorAll('.tik').forEach(card=>{const p=allPosts.find(x=>x.id===card.dataset.pid);if(p)updateCard(card,p);});
    if(currentView==='profile')renderProfile(currentProfileId);
    renderStories();
  });
}

boot();
</script>
