<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TobiSocial</title>

<!-- ============================================================ -->
<!--  FIREBASE SDK (compat) — không cần build, chạy thẳng được     -->
<!-- ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0f1a;
  --bg-2:#141728;
  --card:#181b2e;
  --card-2:#1f2238;
  --line:#2a2e48;
  --txt:#e8eaf6;
  --txt-dim:#9aa0c4;
  --txt-faint:#6b7099;
  --accent:#6c7cff;       /* blurple kiểu Discord */
  --accent-2:#00e0c6;     /* cyan */
  --pop:#ff6b9d;          /* hồng nhấn */
  --good:#3ddc84;
  --radius:18px;
  --shadow:0 14px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(108,124,255,.14), transparent 60%),
    radial-gradient(900px 500px at -5% 10%, rgba(0,224,198,.10), transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:"Plus Jakarta Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
}
::selection{background:var(--accent);color:#fff}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea{font-family:inherit}
img,video{max-width:100%;display:block}
.hidden{display:none !important}

/* ---------- MÀN HÌNH ĐĂNG NHẬP ---------- */
#login{
  min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;
}
.login-card{
  max-width:440px;width:100%;
  background:linear-gradient(180deg,var(--card),var(--bg-2));
  border:1px solid var(--line);border-radius:26px;padding:46px 34px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.login-card::before{
  content:"";position:absolute;inset:-2px;border-radius:28px;padding:2px;
  background:linear-gradient(120deg,var(--accent),var(--accent-2),var(--pop));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.5;
}
.logo{
  font-family:"Bricolage Grotesque";font-weight:800;font-size:34px;letter-spacing:-1px;
  background:linear-gradient(100deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;
}
#login p{color:var(--txt-dim);font-size:15px;margin-bottom:22px}
.login-status{
  margin-top:18px;font-size:13px;color:var(--txt-faint);
  background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px;
}
.spinner{
  width:34px;height:34px;border-radius:50%;margin:0 auto 18px;
  border:3px solid var(--line);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- TOPBAR ---------- */
#app{min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;background:rgba(13,15,26,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .logo{font-size:22px;margin:0}
.topbar .me{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar .me img{width:38px;height:38px;border-radius:50%;border:2px solid var(--accent)}
.topbar .me .nm{font-weight:700;font-size:14px}
.btn-logout{
  background:var(--card-2);color:var(--txt-dim);border:1px solid var(--line);
  padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;transition:.15s;
}
.btn-logout:hover{color:var(--pop);border-color:var(--pop)}

/* ---------- LAYOUT ---------- */
.shell{
  max-width:1180px;margin:0 auto;padding:22px 20px;
  display:grid;grid-template-columns:1fr 1.35fr;gap:22px;align-items:start;
}
.col{display:flex;flex-direction:column;gap:18px}
.col-right{position:sticky;top:78px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card-head{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;
}
.card-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2)}

/* ---------- COMPOSER ---------- */
.composer{padding:16px 18px}
.composer-top{display:flex;gap:12px}
.composer-top img{width:44px;height:44px;border-radius:50%;flex-shrink:0;border:2px solid var(--line)}
.composer textarea{
  flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:14px;
  color:var(--txt);padding:12px 14px;font-size:15px;resize:none;min-height:56px;outline:none;transition:.15s;
}
.composer textarea:focus{border-color:var(--accent)}
.composer textarea::placeholder{color:var(--txt-faint)}
.preview{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative}
.preview .rm{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:30px;text-align:center;
}
.composer-actions{display:flex;align-items:center;gap:8px;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card-2);border:1px solid var(--line);color:var(--txt-dim);
  padding:8px 12px;border-radius:11px;font-size:13px;font-weight:600;transition:.15s;
}
.chip:hover{color:var(--accent-2);border-color:var(--accent-2)}
.btn-post{
  margin-left:auto;background:linear-gradient(100deg,var(--accent),var(--accent-2));
  color:#0d0f1a;font-weight:800;padding:9px 20px;border-radius:11px;font-size:14px;transition:.15s;
}
.btn-post:hover{filter:brightness(1.08)}
.btn-post:disabled{opacity:.5;cursor:not-allowed}
.upbar{font-size:12px;color:var(--txt-faint);margin-top:8px}

/* ---------- POST ---------- */
.post{padding:16px 18px}
.post + .post{border-top:1px solid var(--line)}
.post-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.post-head img{width:42px;height:42px;border-radius:50%;border:2px solid var(--line)}
.post-head .nm{font-weight:700;font-size:14.5px}
.post-head .tm{font-size:12px;color:var(--txt-faint)}
.post-text{font-size:15px;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.post-media{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px}
.post-media img{width:100%}
.post-media video{width:100%}
.post-actions{display:flex;gap:8px}
.act{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--line);color:var(--txt-dim);
  padding:7px 13px;border-radius:10px;font-size:13px;font-weight:600;transition:.15s;
}
.act:hover{border-color:var(--accent);color:var(--txt)}
.act.liked{color:var(--pop);border-color:var(--pop)}
.comments{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:9px}
.cmt img{width:30px;height:30px;border-radius:50%;flex-shrink:0}
.cmt .bub{background:var(--card-2);border:1px solid var(--line);border-radius:13px;padding:8px 12px;font-size:13.5px}
.cmt .bub .cn{font-weight:700;font-size:12.5px;color:var(--accent-2);margin-bottom:2px}
.cmt-form{display:flex;gap:8px;margin-top:4px}
.cmt-form img{width:30px;height:30px;border-radius:50%}
.cmt-form input{
  flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:11px;
  color:var(--txt);padding:8px 12px;font-size:13.5px;outline:none;
}
.cmt-form input:focus{border-color:var(--accent)}

/* ---------- CHAT ---------- */
.chat-card{display:flex;flex-direction:column;height:calc(100dvh - 100px);max-height:760px}
.chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.chat-body::-webkit-scrollbar{width:8px}
.chat-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.msg{display:flex;gap:9px;max-width:88%}
.msg img{width:32px;height:32px;border-radius:50%;flex-shrink:0;align-self:flex-end}
.msg .content{display:flex;flex-direction:column;gap:2px}
.msg .who{font-size:11.5px;color:var(--txt-faint);padding-left:4px}
.msg .bubble{
  background:var(--card-2);border:1px solid var(--line);
  padding:9px 13px;border-radius:15px;font-size:14px;word-break:break-word;
}
.msg.mine{margin-left:auto;flex-direction:row-reverse}
.msg.mine .who{text-align:right;padding-right:4px;padding-left:0}
.msg.mine .bubble{
  background:linear-gradient(120deg,var(--accent),#5a6bff);
  border-color:transparent;color:#fff;border-bottom-right-radius:5px;
}
.chat-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:9px}
.chat-foot input{
  flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:13px;
  color:var(--txt);padding:11px 15px;font-size:14px;outline:none;
}
.chat-foot input:focus{border-color:var(--accent)}
.chat-foot button{
  width:46px;border-radius:13px;font-size:18px;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0d0f1a;font-weight:800;
}

.empty{padding:40px 20px;text-align:center;color:var(--txt-faint);font-size:14px}

/* ---------- RESPONSIVE ---------- */
@media(max-width:880px){
  .shell{grid-template-columns:1fr;gap:18px}
  .col-right{position:static}
  .chat-card{height:auto}
  .chat-body{max-height:420px}
}
</style>
</head>
<body>

<!-- ============================ ĐĂNG NHẬP ============================ -->
<section id="login">
  <div class="login-card">
    <div class="logo">TobiSocial</div>
    <p>Mạng xã hội kết nối Discord của bạn</p>
    <div class="spinner" id="loginSpinner"></div>
    <div class="login-status" id="loginStatus">Đang kiểm tra đăng nhập…</div>
  </div>
</section>

<!-- ============================ APP ============================ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo">TobiSocial</div>
    <div class="me">
      <span class="nm" id="meName"></span>
      <img id="meAvatar" alt="">
      <button class="btn-logout" onclick="logout()">Đăng xuất</button>
    </div>
  </div>

  <div class="shell">
    <!-- CỘT TRÁI: BẢNG TIN -->
    <div class="col">
      <!-- Composer -->
      <div class="card">
        <div class="composer">
          <div class="composer-top">
            <img id="compAvatar" alt="">
            <textarea id="postText" placeholder="Bạn đang nghĩ gì thế?"></textarea>
          </div>
          <div id="postPreview"></div>
          <div class="composer-actions">
            <button class="chip" onclick="pickMedia('image')">🖼️ Ảnh</button>
            <button class="chip" onclick="pickMedia('video')">🎬 Video</button>
            <input type="file" id="mediaInput" class="hidden" />
            <button class="btn-post" id="btnPost" onclick="submitPost()">Đăng</button>
          </div>
          <div class="upbar hidden" id="upbar"></div>
        </div>
      </div>

      <!-- Feed -->
      <div class="card">
        <div class="card-head"><span class="dot"></span> Bảng tin</div>
        <div id="feed"><div class="empty">Đang tải bài viết…</div></div>
      </div>
    </div>

    <!-- CỘT PHẢI: CHAT -->
    <div class="col col-right">
      <div class="card chat-card">
        <div class="card-head"><span class="dot"></span> Chat chung</div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-foot">
          <input id="chatInput" placeholder="Nhắn gì đó…" onkeydown="if(event.key==='Enter')sendChat()">
          <button onclick="sendChat()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1) CẤU HÌNH — ĐIỀN THÔNG TIN CỦA BẠN VÀO ĐÂY
   ============================================================ */

// --- Firebase: lấy ở Project Settings > Your apps > Web app ---
const firebaseConfig = {
  apiKey:            "AIzaSyDD9cobyAok1NixsqBhsIsjm4RjFpQ3nI4",
  authDomain:        "tobisocial-c1222.firebaseapp.com",
  databaseURL:       "https://tobisocial-c1222-default-rtdb.firebaseio.com",  // QUAN TRỌNG: phải có dòng này
  projectId:         "tobisocial-c1222",
  storageBucket:     "tobisocial-c1222.firebasestorage.app",
  messagingSenderId: "16328708651",
  appId:             "1:16328708651:web:c0707cdcf8fc0d54e6106e"
};

// --- Cloudinary: để upload ảnh/video (đăng ký free tại cloudinary.com) ---
const CLOUDINARY_CLOUD  = "ĐIỀN_CLOUD_NAME";       // Dashboard > Cloud name
const CLOUDINARY_PRESET = "ĐIỀN_UPLOAD_PRESET";    // Settings > Upload > tạo "Unsigned" preset

/* ============================================================
   2) KHỞI TẠO
   ============================================================ */
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let me = null;          // { id, name, avatar }
let pendingMedia = null; // { url, type } sau khi upload xong

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = (t)=>{
  const s = Math.floor((Date.now()-t)/1000);
  if(s<60)   return "vừa xong";
  if(s<3600) return Math.floor(s/60)+" phút";
  if(s<86400)return Math.floor(s/3600)+" giờ";
  return new Date(t).toLocaleDateString('vi-VN');
};

/* ============================================================
   3) ĐĂNG NHẬP QUA TOKEN TỪ DISCORD (magic link)
   ============================================================ */
async function boot(){
  const params = new URLSearchParams(location.search);
  const token  = params.get('token');

  // a) Có token trên URL → xác thực với Firebase
  if(token){
    $('loginStatus').textContent = "Đang xác thực token từ Discord…";
    try{
      const snap = await db.ref('loginTokens/'+token).get();
      if(snap.exists()){
        const data = snap.val();
        const expired = data.createdAt && (Date.now() - data.createdAt > 10*60*1000); // hết hạn 10 phút
        if(expired){
          fail("Link đã hết hạn. Gõ lại lệnh trong Discord để lấy link mới nhé.");
          return;
        }
        // Lưu phiên đăng nhập
        me = { id:data.discordId, name:data.username, avatar:data.avatar };
        localStorage.setItem('tobi_me', JSON.stringify(me));
        // Token dùng 1 lần → xoá đi
        db.ref('loginTokens/'+token).remove().catch(()=>{});
        // Lưu hồ sơ user
        db.ref('users/'+me.id).update({ name:me.name, avatar:me.avatar, lastSeen:Date.now() });
        // Xoá token khỏi URL cho sạch
        history.replaceState({}, "", location.pathname);
        enterApp();
        return;
      }else{
        fail("Token không hợp lệ hoặc đã được dùng. Lấy link mới trong Discord nhé.");
        return;
      }
    }catch(e){
      console.error(e);
      fail("Lỗi kết nối Firebase. Kiểm tra lại cấu hình databaseURL.");
      return;
    }
  }

  // b) Không có token nhưng đã đăng nhập trước đó
  const saved = localStorage.getItem('tobi_me');
  if(saved){
    me = JSON.parse(saved);
    enterApp();
    return;
  }

  // c) Chưa đăng nhập
  fail("Bạn chưa đăng nhập. Vào Discord gõ lệnh <b>tweb</b> để bot gửi link đăng nhập riêng cho bạn.");
}

function fail(msg){
  $('loginSpinner').classList.add('hidden');
  $('loginStatus').innerHTML = msg;
}

function logout(){
  localStorage.removeItem('tobi_me');
  location.href = location.pathname;
}

function enterApp(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('meName').textContent   = me.name;
  $('meAvatar').src         = me.avatar;
  $('compAvatar').src       = me.avatar;
  listenFeed();
  listenChat();
}

/* ============================================================
   4) UPLOAD ẢNH / VIDEO LÊN CLOUDINARY
   ============================================================ */
function pickMedia(type){
  const input = $('mediaInput');
  input.accept = type === 'video' ? 'video/*' : 'image/*';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    await uploadToCloudinary(file, type);
    input.value = "";
  };
  input.click();
}

async function uploadToCloudinary(file, type){
  $('upbar').classList.remove('hidden');
  $('upbar').textContent = "⏳ Đang tải lên… (file lớn có thể hơi lâu)";
  $('btnPost').disabled = true;
  try{
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`, {
      method:'POST', body:fd
    });
    const data = await res.json();
    if(!data.secure_url) throw new Error(data.error?.message || 'upload fail');
    pendingMedia = { url:data.secure_url, type };
    renderPreview();
    $('upbar').textContent = "✅ Đã tải lên xong!";
  }catch(e){
    console.error(e);
    $('upbar').textContent = "❌ Tải lên thất bại. Kiểm tra Cloud name & upload preset (phải là Unsigned).";
  }finally{
    $('btnPost').disabled = false;
  }
}

function renderPreview(){
  const box = $('postPreview');
  if(!pendingMedia){ box.innerHTML = ""; return; }
  const m = pendingMedia.type === 'video'
    ? `<video src="${pendingMedia.url}" controls></video>`
    : `<img src="${pendingMedia.url}">`;
  box.innerHTML = `<div class="preview">${m}<div class="rm" onclick="clearMedia()">✕</div></div>`;
}
function clearMedia(){ pendingMedia = null; renderPreview(); $('upbar').classList.add('hidden'); }

/* ============================================================
   5) ĐĂNG BÀI / BẢNG TIN
   ============================================================ */
async function submitPost(){
  const text = $('postText').value.trim();
  if(!text && !pendingMedia){ return; }
  $('btnPost').disabled = true;
  const post = {
    authorId:me.id, authorName:me.name, authorAvatar:me.avatar,
    text, mediaUrl:pendingMedia?.url||null, mediaType:pendingMedia?.type||null,
    createdAt:Date.now(), likes:{}
  };
  await db.ref('posts').push(post);
  $('postText').value = "";
  clearMedia();
  $('upbar').classList.add('hidden');
  $('btnPost').disabled = false;
}

function listenFeed(){
  db.ref('posts').limitToLast(50).on('value', snap=>{
    const arr = [];
    snap.forEach(c=>arr.push({ id:c.key, ...c.val() }));
    arr.reverse(); // mới nhất lên đầu
    renderFeed(arr);
  });
}

function renderFeed(posts){
  const feed = $('feed');
  if(!posts.length){ feed.innerHTML = `<div class="empty">Chưa có bài viết nào. Đăng bài đầu tiên đi! 🎉</div>`; return; }
  feed.innerHTML = posts.map(p=>{
    const liked   = p.likes && p.likes[me.id];
    const likeCnt = p.likes ? Object.keys(p.likes).length : 0;
    let media = "";
    if(p.mediaUrl){
      media = p.mediaType === 'video'
        ? `<div class="post-media"><video src="${esc(p.mediaUrl)}" controls></video></div>`
        : `<div class="post-media"><img src="${esc(p.mediaUrl)}"></div>`;
    }
    return `
    <div class="post" data-id="${p.id}">
      <div class="post-head">
        <img src="${esc(p.authorAvatar)}">
        <div>
          <div class="nm">${esc(p.authorName)}</div>
          <div class="tm">${timeAgo(p.createdAt)}</div>
        </div>
      </div>
      ${p.text ? `<div class="post-text">${esc(p.text)}</div>` : ""}
      ${media}
      <div class="post-actions">
        <button class="act ${liked?'liked':''}" onclick="toggleLike('${p.id}')">
          ${liked?'❤️':'🤍'} ${likeCnt||""}
        </button>
        <button class="act" onclick="focusComment('${p.id}')">💬 Bình luận</button>
      </div>
      <div class="comments" id="cmt-${p.id}"></div>
      <div class="cmt-form">
        <img src="${esc(me.avatar)}">
        <input id="cin-${p.id}" placeholder="Viết bình luận…" onkeydown="if(event.key==='Enter')sendComment('${p.id}')">
      </div>
    </div>`;
  }).join("");
  posts.forEach(p=>listenComments(p.id));
}

function toggleLike(postId){
  const ref = db.ref(`posts/${postId}/likes/${me.id}`);
  ref.get().then(s=> s.exists() ? ref.remove() : ref.set(true));
}

/* ---------- BÌNH LUẬN ---------- */
function focusComment(id){ $(`cin-${id}`)?.focus(); }
function sendComment(postId){
  const inp = $(`cin-${postId}`);
  const text = inp.value.trim();
  if(!text) return;
  db.ref(`comments/${postId}`).push({
    authorId:me.id, authorName:me.name, authorAvatar:me.avatar, text, createdAt:Date.now()
  });
  inp.value = "";
}
function listenComments(postId){
  db.ref(`comments/${postId}`).limitToLast(30).on('value', snap=>{
    const box = $(`cmt-${postId}`);
    if(!box) return;
    const arr = [];
    snap.forEach(c=>arr.push(c.val()));
    box.innerHTML = arr.map(c=>`
      <div class="cmt">
        <img src="${esc(c.authorAvatar)}">
        <div class="bub"><div class="cn">${esc(c.authorName)}</div>${esc(c.text)}</div>
      </div>`).join("");
  });
}

/* ============================================================
   6) CHAT REALTIME
   ============================================================ */
function sendChat(){
  const inp = $('chatInput');
  const text = inp.value.trim();
  if(!text) return;
  db.ref('chat').push({
    authorId:me.id, authorName:me.name, authorAvatar:me.avatar, text, createdAt:Date.now()
  });
  inp.value = "";
}
function listenChat(){
  db.ref('chat').limitToLast(60).on('value', snap=>{
    const arr = [];
    snap.forEach(c=>arr.push(c.val()));
    const body = $('chatBody');
    body.innerHTML = arr.map(m=>{
      const mine = m.authorId === me.id;
      return `
      <div class="msg ${mine?'mine':''}">
        <img src="${esc(m.authorAvatar)}">
        <div class="content">
          <div class="who">${mine?'Bạn':esc(m.authorName)}</div>
          <div class="bubble">${esc(m.text)}</div>
        </div>
      </div>`;
    }).join("");
    body.scrollTop = body.scrollHeight;
  });
}
